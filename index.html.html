<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>영어 활동 룰렛</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f3f4f6;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:900px;margin:auto;padding:20px 15px 40px;text-align:center}
h1{margin:0 0 6px;font-size:24px}
.desc{color:#666;margin-bottom:20px;font-size:14px}
.wheel{position:relative;width:min(85vw,400px);height:min(85vw,400px);margin:auto auto 20px}
.wheel canvas{width:100%;height:100%;border-radius:50%;background:#fff;box-shadow:0 10px 30px #0002,0 0 0 6px #fff}
.pointer{position:absolute;z-index:2;top:-15px;left:50%;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:38px solid #111;filter:drop-shadow(0 3px 3px #0004)}
.spin{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;border:5px solid #fff;background:#111;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
.spin:disabled{background:#888;cursor:not-allowed}
.result{min-height:70px;margin-bottom:10px}
.label{font-size:13px;color:#777}
.result b{display:block;margin-top:4px;font-size:22px;word-break:break-all}
.panel{background:#fff;border-radius:15px;padding:15px;text-align:left;box-shadow:0 5px 20px #00000012}
.st{font-weight:bold;margin:12px 0 8px;font-size:15px}
.row{display:flex;gap:8px;margin-bottom:8px}
.input{flex:1;min-width:0;padding:12px 10px;border:1px solid #ddd;border-radius:8px;font-size:16px}
.btn{border:0;border-radius:8px;padding:12px 14px;font-weight:600;cursor:pointer;font-size:14px}
.blue{background:#2563eb;color:#fff}
.black{background:#111;color:#fff}
.green{background:#16a34a;color:#fff}
.gray{background:#e5e7eb}
.red{background:#fee2e2;color:#b91c1c}
.items{display:flex;flex-direction:column;gap:7px;max-height:320px;overflow-y:auto;border:1px solid #eee;padding:5px;border-radius:8px}
.item{display:flex;align-items:center;gap:7px;padding:6px;background:#f7f7f7;border-radius:8px}
.item.won{background:#e5e5e5}
.num{width:26px;text-align:center;color:#777;font-weight:bold;font-size:13px}
.status{font-size:12px;color:#888;white-space:nowrap}
.wide{width:100%;margin-top:8px}
.reset{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.history{border-top:1px solid #eee;margin-top:16px;padding-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#111;color:#fff;border-radius:20px;padding:6px 10px;font-size:12px}
.msg{text-align:center;color:#666;font-size:12px;margin-top:12px}
@media(max-width:500px){
  .row{flex-direction:column}
  .reset{grid-template-columns:1fr}
  .status{display:none}
}
</style>
</head>
<body>
<main class="wrap">
<h1 id="title">🎯 영어 활동 룰렛</h1>
<div class="desc">당첨된 칸은 회색으로 표시되며 다시 당첨되지 않습니다.</div>
<div class="wheel">
  <div class="pointer"></div>
  <canvas id="c" width="600" height="600"></canvas>
  <button id="spin" class="spin">SPIN</button>
</div>
<div class="result">
  <div class="label">당첨 결과</div>
  <b id="result">-</b>
</div>
<section class="panel">
  <div class="st">룰렛 이름</div>
  <div class="row">
    <input id="titleInput" class="input">
    <button id="titleSave" class="btn blue">저장</button>
  </div>
  <div class="st">룰렛 항목 (25개)</div>
  <div id="items" class="items"></div>
  <button id="add" class="btn black wide">＋ 항목 추가</button>
  <button id="saveItems" class="btn blue wide">💾 항목 이름 저장</button>
  <div class="reset">
    <button id="round" class="btn green">🔄 룰렛 다시 시작</button>
    <button id="full" class="btn gray">🗑 전체 초기화</button>
  </div>
  <div class="history">
    <div class="st">🏆 이번 룰렛 당첨 이력</div>
    <div id="history" class="chips"></div>
  </div>
  <div id="msg" class="msg"></div>
</section>
</main>

<script>
const INITIAL_ITEMS=[
  "watched a movie", "rode a bike", "rode a boat", "ate a delicious food", "played soccer",
  "played a game", "played a basketball", "read a book", "listened to music", "went shopping",
  "went to the park", "went to the beach", "visited my grand parents", "visited a friend", "ate pizza",
  "ate ice cream", "cooked with my family", "played with my friends", "went hiking", "went fishing",
  "went swimming", "took pictures", "cleaned my room", "helped my parents", "watched TV"
];

let data = {
  title: "🎯 영어 활동 룰렛",
  items: INITIAL_ITEMS.map((name, i) => ({ id: "item_" + i, name, disabled: false })),
  history: []
};

const $=id=>document.getElementById(id), c=$("c"), x=c.getContext("2d");
let rotation=0, spinning=false;

function draw(){
  x.clearRect(0,0,600,600);
  let n=data.items.length;
  if(!n)return;
  let s=2*Math.PI/n, r=295;
  data.items.forEach((a,i)=>{
    let q=i*s;
    x.beginPath();x.moveTo(300,300);x.arc(300,300,r,q,q+s);x.closePath();
    x.fillStyle=a.disabled?"#b5b5b5":["#ff6b6b","#4ecdc4","#45b7d1","#96ceb4","#ffcc5c","#ff9f43","#a29bfe","#fd79a8","#00b894","#6c5ce7","#0984e3","#e17055"][i%12];
    x.fill();x.strokeStyle="#fff";x.lineWidth=4;x.stroke();
    x.save();x.translate(300,300);x.rotate(q+s/2);
    x.textAlign="right";x.textBaseline="middle";
    x.fillStyle=a.disabled?"#777":"#fff";
    x.font=`bold ${a.name.length>18?11:a.name.length>12?13:16}px Arial`;
    x.fillText(a.name,r-20,0);
    x.restore();
  });
  x.beginPath();x.arc(300,300,55,0,Math.PI*2);x.fillStyle="#111";x.fill();
}

function render(){
  $("title").textContent=data.title;
  $("titleInput").value=data.title;
  $("items").innerHTML="";
  data.items.forEach((a,i)=>{
    let row=document.createElement("div");
    row.className="item"+(a.disabled?" won":"");
    let n=document.createElement("div");n.className="num";n.textContent=i+1;
    let inp=document.createElement("input");inp.className="input";inp.value=a.name;
    let st=document.createElement("div");st.className="status";st.textContent=a.disabled?"당첨":"대기";
    let del=document.createElement("button");del.className="btn red";del.textContent="삭제";
    del.onclick=()=>delItem(i);
    row.append(n,inp,st,del);
    $("items").append(row);
  });
  $("history").innerHTML=data.history.length?data.history.map((a,i)=>`<span class="chip">${i+1}위: ${a.name}</span>`).join(""):"<span style='color:#999;font-size:12px'>아직 당첨자가 없습니다.</span>";
  let left=data.items.filter(a=>!a.disabled).length;
  $("msg").textContent=`전체 ${data.items.length}개 / 남은 항목 ${left}개`;
  $("spin").disabled=!left;
}

function delItem(i){
  if(spinning)return;
  data.items.splice(i,1);
  draw(); render();
}

function spinRoulette(){
  if(spinning)return;
  let avail=data.items.map((a,i)=>({a,i})).filter(o=>!o.a.disabled);
  if(!avail.length)return;

  spinning=true;
  $("spin").disabled=true;

  let w=avail[Math.floor(Math.random()*avail.length)];
  let n=data.items.length;
  let slice=360/n;
  let winnerCenter=w.i*slice+slice/2;
  let target=270-winnerCenter;
  let normalizedCurrent=((rotation%360)+360)%360;
  let delta=(target-normalizedCurrent+360)%360;
  let fullTurns=4+Math.floor(Math.random()*2);
  let final=rotation + fullTurns*360 + delta;
  let dur=2300;

  c.style.transition=`transform ${dur}ms cubic-bezier(.08,.78,.16,1)`;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      c.style.transform=`rotate(${final}deg)`;
    });
  });

  rotation=final;

  setTimeout(()=>{
    let a=data.items[w.i];
    a.disabled=true;
    data.history.push({id:a.id, name:a.name});
    $("result").textContent="🎉 "+a.name;
    draw(); render();
    spinning=false;
    let left=data.items.filter(a=>!a.disabled).length;
    $("spin").disabled=!left;
    if(left){
      $("msg").textContent=`남은 항목: ${left}개`;
    }else{
      $("msg").textContent="🎉 모든 추첨이 끝났습니다. '룰렛 다시 시작'을 눌러주세요.";
    }
  },dur+100);
}

$("spin").onclick=spinRoulette;
$("titleSave").onclick=()=>{if(spinning)return;let v=$("titleInput").value.trim();if(!v)return alert("제목을 입력해주세요.");data.title=v;render();};
$("saveItems").onclick=()=>{
  if(spinning)return;
  let inputs=document.querySelectorAll("#items .input");
  inputs.forEach((e,i)=>data.items[i].name=e.value.trim());
  if(data.items.some(a=>!a.name))return alert("항목 이름을 비워둘 수 없습니다.");
  let names=data.items.map(a=>a.name);
  if(new Set(names).size!==names.length)return alert("중복된 항목 이름이 있습니다.");
  draw(); render();
  alert("저장되었습니다.");
};
$("add").onclick=()=>{
  if(spinning)return;
  const inputs=[...document.querySelectorAll("#items .input")];
  inputs.forEach((input,i)=>{if(data.items[i])data.items[i].name=input.value;});
  data.items.push({id:"item_"+Date.now(),name:"항목 "+(data.items.length+1),disabled:false});
  draw(); render();
};
$("round").onclick=()=>{if(spinning)return;if(!confirm("다시 시작하시겠습니까?"))return;data.items.forEach(a=>a.disabled=false);data.history=[];rotation=0;c.style.transition="none";c.style.transform="rotate(0deg)";void c.offsetWidth;$("result").textContent="-";draw();render();};
$("full").onclick=()=>{
  if(spinning)return;
  if(!confirm("전체 초기화하시겠습니까?"))return;
  data = {
    title: "🎯 영어 활동 룰렛",
    items: INITIAL_ITEMS.map((name, i) => ({ id: "item_" + i, name, disabled: false })),
    history: []
  };
  rotation=0;c.style.transition="none";c.style.transform="rotate(0deg)";$("result").textContent="-";draw();render();
};

render(); draw();
</script>
</body>
</html>
